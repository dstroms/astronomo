name: Feature request
description: Suggest a change that is not on the roadmap yet.
title: "<short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read `ROADMAP.md` first. If the change is already listed there, open a pull request instead of an issue.

        For something that does not work as documented, use the *Bug report* template. For a run on a real telescope,
        use the *First-light report*. For a **safety or security** problem (an interlock that did not hold, a command
        that could move the telescope unsafely, a leaked secret), use the private report link on the issue chooser.
  - type: textarea
    id: problem
    attributes:
      label: What observing problem does this solve?
      description: A night that cannot be reduced, a file a network wants, or a first-light step that is missing. Describe the problem, not only a design.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would you like Astronomo to do?
      description: The ground rules in CONTRIBUTING.md still apply. A change that sends data on its own, or that weakens a safety interlock, will not be accepted.
    validations:
      required: true
  - type: dropdown
    id: roadmap
    attributes:
      label: Is this already on the roadmap?
      options:
        - Not listed
        - Already listed
        - Not sure
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A link to a published specification, or a note that you would like to build it yourself.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed my location, name, codes and network addresses (or they are not needed).
          required: true
