name: Bug report
description: Something in Astronomo does not work as documented.
title: "<short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **safety or security** problem (an interlock that did not hold, a command that could move the telescope
        unsafely, a leaked secret), do not post here: use the private report link on the issue chooser.
        For a run on a real telescope, use the *First-light report* template instead.
        For a new capability, use the *Feature request* template.
  - type: input
    id: version
    attributes:
      label: Astronomo version
      description: The commit hash (`git rev-parse --short HEAD`) and your Python version.
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The exact command, and whether it was `--simulate`, an archive replay, or the dashboard.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The error or the wrong result, with the relevant log lines.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Does it also happen in simulation? Does the test suite pass on your machine (`pytest -n auto`)?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed my location, name, codes and network addresses (or they are not needed).
          required: true
