name: Upload file result (accepted or rejected by a network)
description: Tell us what the AAVSO, the MPC or another destination said about a file Astronomo prepared.
title: "Upload result: <destination>, accepted or rejected"
labels: ["upload-format"]
body:
  - type: markdown
    attributes:
      value: |
        Astronomo prepares files and never sends them, and its formats are checked against published specifications,
        not against the services themselves. What a service actually said is some of the most useful evidence we can get.
        You review and submit every file yourself. Please do not paste your **observer code** or contact details.
  - type: input
    id: version
    attributes:
      label: Astronomo version
      description: The commit hash (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: destination
    attributes:
      label: Destination
      options:
        - AAVSO Exoplanet Database
        - AAVSO WebObs (extended format)
        - Minor Planet Center (ADES)
        - Exoplanet Watch
        - ExoClock
        - Other
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Accepted
        - Accepted with warnings
        - Rejected
        - No reply or unclear
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What the service said
      description: The message or error text, exactly as shown.
      render: text
    validations:
      required: true
  - type: textarea
    id: header
    attributes:
      label: The file's header lines
      description: The first lines of the file (the `#KEY=value` header, or the ADES header) with your observer code, name and location removed. A few data rows are enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything you changed by hand before submitting
      description: If you had to edit the file to get it accepted, say what, because that is the bug.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed my observer code, name and location from what I pasted.
          required: true
