[pytest]
pythonpath = .
testpaths = tests
# Keep each test file on one worker (the whole-mission fixtures are shared within a file); use with -n auto.
addopts = --dist loadscope
log_level = INFO
markers =
    ollama: needs a running local Ollama server with a model pulled (skipped automatically otherwise)
    slow: runs a whole simulated mission or other heavy image processing (several seconds each); deselect with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
